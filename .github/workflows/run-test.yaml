name: run tests

#триггер
on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: set up services (review app) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{hashFiles('**/pom.xml')}}
          restore-keys: |
            {{ runner.os }}-maven-
            
      - name: Set up services
        run: bash infra/docker_compose/restart_docker.sh

      - name: Run tests
        run: ./mvnw clean test
